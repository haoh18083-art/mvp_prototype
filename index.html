<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>登录 · 销售指挥官 V0.2</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body class="login-page">
<main class="login-shell">
  <section class="login-brand" aria-label="销售指挥官">
    <div class="login-brand__head">
      <span class="login-brand__mark" aria-hidden="true">SC</span>
      <div>
        <div class="login-brand__name">销售指挥官</div>
        <div class="login-brand__edition">SALES COMMANDER · V0.2</div>
      </div>
    </div>
    <div class="login-brand__body">
      <span class="login-brand__eyebrow">WORKSPACE ACCESS</span>
      <p class="login-brand__statement">连接客户、销售与方案协作的统一工作台。</p>
    </div>
    <div class="login-brand__status"><span aria-hidden="true"></span>V0.2 本地演示环境</div>
  </section>

  <section class="login-main" aria-labelledby="login-title">
    <div class="login-panel">
      <header class="login-panel__head">
        <span class="login-panel__kicker">企业账号</span>
        <h1 id="login-title">登录</h1>
        <p>使用企业邮箱账号进入对应工作台。</p>
      </header>

      <form class="login-form" id="login-form" novalidate>
        <div class="login-field">
          <label for="login-email">企业邮箱</label>
          <div class="login-affix">
            <input id="login-email" name="email" type="text" inputmode="email" autocomplete="username" placeholder="请输入邮箱前缀" aria-describedby="login-error">
            <span>@teddymobile.cn</span>
          </div>
        </div>

        <div class="login-field">
          <label for="login-password">密码</label>
          <div class="login-password">
            <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" aria-describedby="login-error">
            <button id="password-toggle" type="button" aria-label="显示密码" title="显示密码">显示</button>
          </div>
        </div>

        <div class="login-form__error" id="login-error" role="alert" aria-live="polite"></div>
        <button class="btn btn--primary login-submit" id="login-submit" type="submit">登录</button>
      </form>

      <div class="login-demo">
        <div class="login-demo__head">
          <span>演示身份</span>
          <small>本地原型账号</small>
        </div>
        <div class="login-demo__grid" id="login-accounts" aria-label="演示账号"></div>
      </div>

      <footer class="login-panel__foot">
        <span>原型数据仅保存在当前浏览器</span>
        <a href="prototype.html">功能原型导航</a>
      </footer>
    </div>
  </section>
</main>

<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/login.js"></script>
</body>
</html>

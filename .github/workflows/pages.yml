name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript
        run: find js mobile-ios-sales-assistant/js -type f -name '*.js' -print0 | xargs -0 -n 1 node --check

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html prototype.html _site/
          cp -R css js pages mobile-ios-sales-assistant _site/
          touch _site/.nojekyll
          VERSION_NAME=$(head -1 VERSION 2>/dev/null || echo "")
          printf '{"commit":"%s","version":"%s"}\n' "$GITHUB_SHA" "$VERSION_NAME" > _site/version.json
          test -s _site/index.html
          test -s _site/prototype.html
          test -s _site/mobile-ios-sales-assistant/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

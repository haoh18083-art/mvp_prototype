<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>销售助手 · 移动端</title>
  <link rel="stylesheet" href="../css/shared.css?v=20260922-r1558-inbox-enter-text-link">
</head>
<body class="platform-ios">
  <!-- 固定在视口顶部的系统状态栏，不随内容滚动 -->
  <div class="ios-system-status" aria-label="iOS 状态栏"><span class="t-eyebrow">9:41</span><span class="mobile-status-icons"><span class="t-eyebrow">▮▮▮</span><span class="t-eyebrow">Wi‑Fi</span><span class="t-eyebrow">▰</span></span></div>
  <!-- 应用外壳：顶栏 + 视图容器 + 本人助手悬浮入口 + 四入口底栏。图标由 js/components/icons.js 在启动时注入。 -->
  <div class="mobile-frame" data-home-page="">
    <header class="mobile-topbar" data-topbar="" data-od-id="ios-topbar"></header>
    <main class="mobile-content" data-view-root="" data-od-id="ios-view-root"></main>
    <!-- 本人助手入口：客户／相关／我的常驻（M05-1 US-MB1-11） -->
    <button class="mobile-fab" type="button" data-open-assistant="" aria-label="打开本人助手" data-od-id="ios-assistant-fab"></button>
    <!-- 空间助手入口：仅客户空间详情内展示，可拖动换位（M05-3 §4.3）；挂在滚动内容区外，保证悬浮不随滚动 -->
    <button class="space-fab" type="button" data-open-space-assistant="" aria-label="空间助手" data-od-id="ios-space-assistant-fab" hidden></button>
    <nav class="mobile-bottom-nav" data-bottom-nav="" aria-label="底部导航">
      <button class="bottom-nav-item is-active" type="button" data-nav-item="today"><span class="t-eyebrow">今日</span></button>
      <button class="bottom-nav-item" type="button" data-nav-item="customers"><span class="t-eyebrow">客户</span></button>
      <button class="bottom-nav-item" type="button" data-nav-item="related"><span class="t-eyebrow">相关</span></button>
      <button class="bottom-nav-item" type="button" data-nav-item="profile"><span class="t-eyebrow">我的</span></button>
    </nav>
  </div>
  <!-- iframe 加载本人助手对话页；返回通过 postMessage 通知本页收起 -->
  <section class="assistant-page" data-assistant-page="" aria-label="本人助手" aria-hidden="true" data-od-id="ios-chat-transition"><iframe class="ios-chat-frame" src="mobile-ios-chat.html" title="本人助手对话"></iframe></section>
  <div class="sheet-layer" data-sheet-layer=""></div>
  <div class="toast" data-toast="" role="status"><span class="t-body" data-toast-message=""></span></div>
  <!-- 两端同源：移动端直接加载网页端的演示数据与业务模型，不做分端存储 -->
  <script src="../../js/data.js?v=20260921-r1708"></script>
  <script src="../../js/features/store.js?v=20260921-r1843-profile-name-only"></script>
  <script src="../js/app.js?v=20260922-r1558-inbox-enter-text-link"></script>
</body></html>

<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>销售助手 · 移动端</title>
  <link rel="stylesheet" href="../css/shared.css?v=20260921-r0910">
</head>
<body class="platform-ios">
  <!-- 固定在视口顶部的系统状态栏，不随内容滚动 -->
  <div class="ios-system-status" aria-label="iOS 状态栏"><span>9:41</span><span class="mobile-status-icons"><span>▮▮▮</span><span>Wi‑Fi</span><span>▰</span></span></div>
  <!-- 应用外壳：顶栏 + 视图容器 + 本人助手悬浮入口 + 四入口底栏 -->
  <div class="mobile-frame" data-home-page="">
    <header class="mobile-topbar" data-topbar="" data-od-id="ios-topbar"></header>
    <main class="mobile-content" data-view-root="" data-od-id="ios-view-root"></main>
    <!-- 本人助手入口：跨今日／客户／相关／我的四个主入口常驻（M05-1 US-MB1-11） -->
    <button class="mobile-fab" type="button" data-open-assistant="" aria-label="打开本人助手" data-od-id="ios-assistant-fab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6.5A2.5 2.5 0 0 1 7.5 4h9A2.5 2.5 0 0 1 19 6.5v6a2.5 2.5 0 0 1-2.5 2.5H13l-4.5 4v-4h-1A2.5 2.5 0 0 1 5 12.5v-6Z"></path><path d="M9 9.5h6M9 12h3"></path></svg>
    </button>
    <nav class="mobile-bottom-nav" data-bottom-nav="" aria-label="底部导航">
      <button class="bottom-nav-item is-active" type="button" data-nav-item="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M8 3v4M16 3v4M4 10h16"></path></svg><span>今日</span></button>
      <button class="bottom-nav-item" type="button" data-nav-item="customers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"></circle><path d="M3.8 19c.4-3.1 2.1-5 5.2-5s4.8 1.9 5.2 5M16 5.8a3 3 0 0 1 0 5.8M16 14c2.2.1 3.7 1.8 4.2 5"></path></svg><span>客户</span></button>
      <button class="bottom-nav-item" type="button" data-nav-item="related"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"></path><path d="M8 8h8M8 12h8M8 16h5"></path></svg><span>相关</span></button>
      <button class="bottom-nav-item" type="button" data-nav-item="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"></circle><path d="M5.5 20c.6-3.7 2.8-5.7 6.5-5.7s5.9 2 6.5 5.7"></path></svg><span>我的</span></button>
    </nav>
  </div>
  <!-- iframe 加载本人助手对话页；返回通过 postMessage 通知本页收起 -->
  <section class="assistant-page" data-assistant-page="" aria-label="本人助手" aria-hidden="true" data-od-id="ios-chat-transition"><iframe class="ios-chat-frame" src="mobile-ios-chat.html" title="本人助手对话"></iframe></section>
  <div class="sheet-layer" data-sheet-layer=""></div>
  <div class="toast" data-toast="" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4 4L19 6"></path></svg><span data-toast-message=""></span></div>
  <!-- 两端同源：移动端直接加载网页端的演示数据与业务模型，不做分端存储 -->
  <script src="../../js/data.js?v=20260921-r0910"></script>
  <script src="../../js/features/store.js?v=20260921-r0910"></script>
  <script src="../js/app.js?v=20260921-r0910"></script>
</body></html>
